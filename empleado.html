<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3B3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Super Tienda Elohim — Panel de Empleados</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a href="index.html" class="brand">Super Tienda Elohim <small>Empleados</small></a>
  <nav>
    <a href="index.html">Catálogo</a>
    <a href="admin.html">Administración</a>
  </nav>
</header>

<main>
  <div id="loginSection" class="login-wrap">
    <div class="login-card">
      <div class="eyebrow">Acceso restringido</div>
      <h1 style="font-size:1.3rem;">Panel de empleados</h1>
      <p class="hint" style="margin-bottom:1.2rem;">Ingresa con tu cuenta para ver los pedidos entrantes.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <p class="error-text" id="loginError"></p>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
      </form>
    </div>
  </div>

  <div id="appSection" style="display:none;">
    <div class="page-head" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.75rem;">
      <div>
        <span class="session-badge"><span class="dot"></span> <span id="userLabel"></span></span>
        <h1>Pedidos recibidos</h1>
        <p>Vista de solo lectura — los pedidos se actualizan en tiempo real.</p>
      </div>
      <button class="btn btn-outline" id="logoutBtn">Cerrar sesión</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Productos</th>
            <th>Subtotal</th>
            <th>Envío</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="6" class="empty-note">Cargando pedidos…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script type="module" src="js/empleado.js"></script>
</body>
</html>
